name = "sun-nav-sync"
main = "worker.js"
compatibility_date = "2024-09-23"

# KV 命名空间绑定：在 Cloudflare 控制台创建 KV 后，把 id 填到下面
kv_namespaces = [
  { binding = "KV", id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID" }
]

# 非敏感配置（也可改成 secret，见下）
[vars]
WEBDAV_URL  = "https://dav.jianguoyun.com/dav/"
WEBDAV_PATH = "/sun-nav"

# 敏感信息请用 secret 设置（不要写在本文件，避免泄露）：
#   npx wrangler secret put SITE_PASSWORD
#   npx wrangler secret put WEBDAV_USER
#   npx wrangler secret put WEBDAV_PASS
# 变量名大小写均可，Worker 内部不区分（WEBDAV_URL / webdav_url 等价）。

# 定时备份：每天 UTC 01:00 = 北京时间 09:00
[triggers]
crons = ["0 1 * * *"]
