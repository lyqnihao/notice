<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>正在播放 · 潮汐 TIDEFLOW</title>
<meta name="description" content="潮汐 TIDEFLOW 播放页：直链解析、影片资料、可点击标签分类搜索。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1020'/%3E%3Cpath d='M4 18c4-6 7-6 11 0s7 6 11 0' stroke='%23f5b13c' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='20' r='2.4' fill='%23ffd27a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site">
  <div class="player-head">
    <a class="back-link" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      返回首页
    </a>
    <span class="logo-name" style="font-size:16px">潮汐 TIDEFLOW</span>
  </div>
</header>

<div class="player-wrap">
  <!-- 左：播放器 -->
  <div>
    <div class="video-box" id="videoBox">
      <video id="video" controls playsinline preload="auto"></video>
      <div class="video-loading" id="videoLoading">
        <div class="spin"></div>
        <span id="videoLoadingText">正在解析直链…</span>
      </div>
    </div>
    <div class="video-tools" id="videoTools">
      <button class="btn" id="retryBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9"/><path d="M21 3v6h-6"/></svg>
        重试
      </button>
      <button class="btn" id="externalBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
        外部播放器
      </button>
    </div>

    <div class="ep-panel" id="streamPanel" style="display:none">
      <h3>线路</h3>
      <div class="ep-list" id="streamList"></div>
    </div>

    <div class="ep-panel" id="epPanel" style="display:none">
      <h3>选集</h3>
      <div class="ep-list" id="epList"></div>
    </div>
  </div>

  <!-- 右：资料 / 直链 -->
  <div class="side">
    <div class="panel">
      <div class="v-title-row">
        <h1 class="v-title" id="vTitle">加载中…</h1>
        <button class="fav-btn" id="favBtn" title="收藏 / 取消收藏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
      </div>
      <div class="v-sub" id="vSub"></div>
      <div class="meta-list" id="metaList"></div>
      <h3 style="margin-top:16px">标签（点击即可站内搜索）</h3>
      <div class="tag-list" id="tagList"></div>
    </div>

    <div class="panel">
      <h3>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        直链解析
      </h3>
      <div class="direct-box" id="directBox">等待解析…</div>
      <div class="direct-actions">
        <button class="btn" id="copyBtn">复制直链</button>
        <button class="btn" id="downloadM3u8Btn" title="下载剔除广告后的 m3u8，丢进 VLC/PotPlayer 可直接播">下载过滤后播放列表</button>
      </div>
      <div class="adf-row" style="margin-top:12px" id="adfRow">
        <span>广告过滤<span class="note">解析流媒体播放列表，剔除异目录广告分段</span></span>
        <span class="switch">
          <input type="checkbox" id="adfCheck" checked>
          <span class="track"></span>
        </span>
      </div>
      <div class="adf-row note" id="adfNote" style="margin-top:6px"></div>
    </div>
  </div>
</div>

<footer class="foot">
  潮汐 TIDEFLOW · 多源免费视频聚合 · 直链播放，不经过本站服务器 · 成人内容过滤默认开启（安全模式）
</footer>

<script src="js/config.js?v=1.3.1"></script>
<script src="js/sources.js?v=1.3.1"></script>
<script src="js/hls.min.js?v=1.3.1"></script>
<script src="js/player.js?v=1.3.1"></script>
</body>
</html>
