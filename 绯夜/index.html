<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07060a">
<title>绯夜 · 深夜放映厅</title>
<meta name="description" content="绯夜片库 · 高清在线播放，分类齐全、更新及时，点开即看">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="hd" id="hd">
  <div class="hd-in">
    <a class="brand" href="#/" aria-label="回到首页">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/>
          <path d="M11.6 9.4v5.2l4.2-2.6z"/>
        </svg>
      </span>
      <span class="brand-txt"><b>绯夜</b><i>CRIMSON NIGHT</i></span>
    </a>

    <form class="search" id="searchForm" role="search">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <input id="q" type="search" placeholder="搜片名 / 番号 / 关键词" autocomplete="off" aria-label="搜索">
      <button type="button" class="clr" id="clr" aria-label="清空" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </form>

    <div class="hd-acts">
      <button class="act" id="favBtn" type="button" aria-label="我的收藏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.8l5.9-.9z"/></svg>
        <em>收藏</em>
      </button>
      <button class="act" id="randBtn" type="button" aria-label="随机一部">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.3"/><circle cx="15.5" cy="15.5" r="1.3"/><circle cx="15.5" cy="8.5" r="1.3"/><circle cx="8.5" cy="15.5" r="1.3"/></svg>
        <em>随机</em>
      </button>
      <button class="menu-btn" id="menuBtn" type="button" aria-label="展开分类" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>

  <nav class="cats" id="cats" aria-label="分类导航"><div class="cats-in" id="catsIn"></div></nav>
</header>

<main id="app" role="main"></main>

<footer class="ft">
  <div class="ft-in">
    <span class="ft-brand">绯夜 · CRIMSON NIGHT</span>
    <span class="ft-note">本站资源均采集自公开网络，仅供个人学习交流，请勿传播</span>
  </div>
</footer>

<div class="player-mask" id="pmask" hidden>
  <div class="player-box" role="dialog" aria-modal="true" aria-label="视频播放">
    <div class="player-hd">
      <h3 id="pTitle">—</h3>
      <button class="pfav" id="pFav" type="button" aria-label="收藏这一部">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.8l5.9-.9z"/></svg>
      </button>
      <button class="pclose" id="pclose" type="button" aria-label="关闭播放器">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="player-video">
      <video id="video" controls playsinline preload="none"></video>
      <div class="pfall" id="pfall" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/>
        </svg>
        <p id="pfWhy">这条线路暂时打不开</p>
        <small id="pfTip">片源服务器的问题，换一集或换一部试试</small>
        <div class="pf-btns">
          <button id="pfSwitch" type="button" hidden>换条线路</button>
          <a id="pfLink" href="#" target="_blank" rel="noopener">用外部播放器打开</a>
        </div>
      </div>
    </div>

    <div class="pmeta" id="pMeta" hidden></div>
    <div class="plines" id="pLines" hidden></div>
    <div class="eps" id="eps"></div>
  </div>
</div>

<script src="/hls.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
