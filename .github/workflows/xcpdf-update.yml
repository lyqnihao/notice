name: XCPDF 版本检查与自动更新

# 每天 09:30（北京时间）自动检查一次，也可手动触发
on:
  schedule:
    - cron: '30 1 * * *'   # UTC 01:30 = 北京时间 09:30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xcpdf-update
  cancel-in-progress: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出版仓库
        uses: actions/checkout@v4

      - name: 对比线上版本与本站版本
        id: check
        run: |
          python3 <<'EOF'
          import re, os, urllib.request

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read().decode("utf-8", errors="replace")

          def parse_ver(s):
              m = re.search(r'V(\d+(?:\.\d+)+)', s)
              if not m:
                  raise SystemExit("::error::无法从文本中解析版本号: " + s[:200])
              return m.group(1), tuple(int(x) for x in m.group(1).split("."))

          # 1) 官网首页 "当前版本" 后面的版本号（latest-tag2）
          site_html = fetch("https://www.xcpdf.com/")
          m = re.search(r'当前版本\s*<strong[^>]*>\s*(V[\d.]+)', site_html)
          if not m:
              m = re.search(r'id="latest-tag2?[^"]*"[^>]*>\s*(V[\d.]+)', site_html)
          if not m:
              raise SystemExit("::error::官网首页未找到“当前版本”号")
          site_raw, site_ver = parse_ver(m.group(1))

          # 2) GitHub Pages 页面标题里的版本号
          pages_html = fetch("https://lyqnihao.github.io/notice/XCPDF/")
          mt = re.search(r'<title>([^<]*)</title>', pages_html, re.I)
          if not mt:
              raise SystemExit("::error::GitHub Pages 页面未找到 <title>")
          pages_raw, pages_ver = parse_ver(mt.group(1))

          print(f"官网版本: {site_raw}  -> {site_ver}")
          print(f"本站版本: {pages_raw} -> {pages_ver}")

          has_new = site_ver > pages_ver

          # Actions Summary 标题：项目名+版本号，版本号跟随官网最新版本
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"# XCPDF_V{site_raw}\n\n")
              f.write(f"- 官网最新版本: **{site_raw}**\n")
              f.write(f"- 本站(Pages)版本: **{pages_raw}**\n")
              f.write(f"- 检查结果: {'发现新版本，开始下载更新' if has_new else '无更新，跳过'}\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"has_new={'true' if has_new else 'false'}\n")
              f.write(f"site_ver={site_raw}\n")
          EOF
        shell: bash

      - name: 下载新版 HTML 并更新 index.html
        if: steps.check.outputs.has_new == 'true'
        env:
          SITE_VER: ${{ steps.check.outputs.site_ver }}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          # 注意：该下载端点必须携带浏览器 UA，否则会被 302 重定向回首页
          curl -fSL -A "$UA" -H "Referer: https://www.xcpdf.com/" \
            https://www.xcpdf.com/download/pdf-toolbox -o XCPDF/index.html

          SIZE=$(stat -c%s XCPDF/index.html)
          echo "下载文件大小: $SIZE 字节"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::下载的文件过小（$SIZE 字节），疑似重定向页面，中止提交"
            exit 1
          fi

          TITLE=$(grep -oP '(?<=<title>)[^<]{0,120}' XCPDF/index.html | head -1)
          echo "下载文件标题: $TITLE"
          echo "$TITLE" | grep -q "V${SITE_VER}" || {
            echo "::error::下载文件标题未包含版本号 V${SITE_VER}，文件可能不正确，中止提交"
            exit 1
          }
          echo "- 下载校验通过: $(stat -c%s XCPDF/index.html) 字节, 标题含 V${SITE_VER}" >> "$GITHUB_STEP_SUMMARY"

      - name: 有新版本时提交并推送
        if: steps.check.outputs.has_new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add XCPDF/index.html
          git commit -m "chore(XCPDF): 自动更新至 ${{ steps.check.outputs.site_ver }}"
          git push
          echo "- 已提交并推送 XCPDF/index.html（将自动触发 GitHub Pages 部署）" >> "$GITHUB_STEP_SUMMARY"

      - name: 无更新
        if: steps.check.outputs.has_new == 'false'
        run: |
          echo "- 最终结果: 本站已是最新版本，无操作" >> "$GITHUB_STEP_SUMMARY"
